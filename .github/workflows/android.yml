name: Universal Android Build & Auto Release

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 0. Checkout with submodules
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 || \
          git submodule update --init --recursive

      # ---------------------------------------------------------------
      # 1. Setup JDK 17
      # ---------------------------------------------------------------
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ---------------------------------------------------------------
      # 2. Setup Android SDK + NDK 25.2
      # ---------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools ndk;25.2.9519653'
          accept-android-sdk-licenses: true

      # ---------------------------------------------------------------
      # 3. Install build dependencies (autotools, etc.)
      # ---------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            automake ant autopoint cmake build-essential libtool-bin \
            patch pkg-config protobuf-compiler ragel subversion unzip git \
            flex python wget

      # ---------------------------------------------------------------
      # 4. Build LibVLC native libraries (libvlc.so, libvlccore.so)
      #    This is the CRITICAL step that was missing before.
      # ---------------------------------------------------------------
      - name: Build LibVLC
        env:
          ANDROID_SDK: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK: /usr/local/lib/android/sdk/ndk/25.2.9519653
        run: |
          echo "Building LibVLC for arm64-v8a. This may take 30-60 minutes..."
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK=$ANDROID_NDK"

          # The -l flag tells compile.sh to build only LibVLC
          # The -a flag specifies the ABI
          # --no-ml skips the medialibrary build
          chmod +x buildsystem/compile.sh
          ./buildsystem/compile.sh -l -a arm64-v8a --no-ml

          # Verify that the native libraries were built
          echo "=== Checking for built .so files ==="
          find . -name "libvlc.so" -o -name "libvlccore.so" | head -20
          echo "=== End of .so file check ==="

      # ---------------------------------------------------------------
      # 5. Generate debug.keystore (if not release)
      # ---------------------------------------------------------------
      - name: Generate debug.keystore
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          KEYSTORE_PATH="$GITHUB_WORKSPACE/debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists, skipping."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          keytool -genkey -v \
            -keystore "$KEYSTORE_PATH" \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "Created debug.keystore at $KEYSTORE_PATH"

      # ---------------------------------------------------------------
      # 6. Decode release keystore (if release)
      # ---------------------------------------------------------------
      - name: Decode release keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret not set. Skipping."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          echo "Release keystore decoded."

      # ---------------------------------------------------------------
      # 7. Determine build variant
      # ---------------------------------------------------------------
      - name: Determine build variant
        id: variant
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
          else
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
          fi

      # ---------------------------------------------------------------
      # 8. Build APK
      # ---------------------------------------------------------------
      - name: Build APK
        run: |
          TASK="${{ steps.variant.outputs.task }}"
          if ./gradlew tasks --all 2>/dev/null | grep -q "^${TASK}"; then
            ./gradlew "$TASK" --stacktrace --no-daemon
          else
            ./gradlew ":app:${TASK}" --stacktrace --no-daemon
          fi

      # ---------------------------------------------------------------
      # 9. Prepare APK for release
      # ---------------------------------------------------------------
      - name: Prepare APK
        id: apk
        run: |
          APK_PATH=$(find . -path "*/build/outputs/apk/*/*.apk" | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found!"
            find . -path "*/build/outputs/*" -type f 2>/dev/null || true
            exit 1
          fi
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          NEW_NAME="app-${BUILD_TYPE}-${TIMESTAMP}-run${{ github.run_number }}.apk"
          cp "$APK_PATH" "$NEW_NAME"
          echo "apk_path=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=build-${{ github.run_number }}-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "Built: $NEW_NAME"

      # ---------------------------------------------------------------
      # 10. Upload artifact
      # ---------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.run_number }}
          if-no-files-found: error
          path: ${{ steps.apk.outputs.apk_path }}

      # ---------------------------------------------------------------
      # 11. Create GitHub Release
      # ---------------------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Build ${{ github.run_number }} - ${{ github.sha }}"
          body: |
            Auto-generated APK from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
            Build type: ${{ github.event.inputs.build_type || 'debug' }}
            Triggered by: ${{ github.actor }}
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
